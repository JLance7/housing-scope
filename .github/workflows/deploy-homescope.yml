name: Deploy HomeScope (AWS)
on:
  workflow_dispatch:
    inputs:
      action:
        description: Plan or apply (apply creates/updates billable cloud resources)
        required: true
        type: choice
        options: [plan, apply]
        default: plan
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-homescope-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'JLance7/housing-scope' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: prod
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      STATE_BUCKET: ${{ vars.HOMES_TF_STATE_BUCKET }}
      TF_VAR_region: ${{ vars.AWS_REGION || 'us-east-2' }}
      TF_VAR_environment: prod
      TF_VAR_package_path: ${{ github.workspace }}/.build/homescope.zip
      TF_VAR_runtime_boundary_arn: ${{ vars.HOMES_RUNTIME_BOUNDARY_ARN }}
      DEPLOY_ROLE_ARN: ${{ vars.HOMES_DEPLOY_ROLE_ARN }}
      TF_IN_AUTOMATION: 'true'
      TF_VAR_auth_domain_prefix: ${{ vars.HOMES_AUTH_DOMAIN_PREFIX }}
      TF_VAR_google_client_id: ${{ vars.HOMES_GOOGLE_CLIENT_ID }}
      TF_VAR_google_client_secret: ${{ secrets.HOMES_GOOGLE_CLIENT_SECRET }}
      TF_VAR_rentcast_api_key: ${{ secrets.HOMES_RENTCAST_API_KEY }}
      TF_VAR_rentcast_markets: ${{ vars.HOMES_RENTCAST_MARKETS || 'White Plains,NY' }}
      TF_VAR_listing_feed_url: ${{ vars.HOMES_FEED_URL }}
      TF_VAR_listing_feed_token: ${{ secrets.HOMES_FEED_TOKEN }}
      TF_VAR_enable_feed_sync: ${{ vars.HOMES_ENABLE_FEED_SYNC || 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Check frontend scripts
        run: |
          node --check web/auth.js
          node --check web/app.js
      - name: Build the Linux Lambda ZIP
        run: python scripts/package_lambda.py
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: '1.17.1'
          terraform_wrapper: false
      - name: Check configuration
        run: |
          : "${DEPLOY_ROLE_ARN:?Set HOMES_DEPLOY_ROLE_ARN}"
          : "${TF_VAR_runtime_boundary_arn:?Set HOMES_RUNTIME_BOUNDARY_ARN}"
          : "${STATE_BUCKET:?Set HOMES_TF_STATE_BUCKET}"
          : "${TF_VAR_auth_domain_prefix:?Set HOMES_AUTH_DOMAIN_PREFIX}"
          : "${TF_VAR_google_client_id:?Set HOMES_GOOGLE_CLIENT_ID}"
          : "${TF_VAR_google_client_secret:?Set HOMES_GOOGLE_CLIENT_SECRET}"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Initialize remote state
        run: terraform -chdir=infra init -input=false -lockfile=readonly -backend-config="bucket=$STATE_BUCKET" -backend-config="key=columbus-homes/prod/terraform.tfstate" -backend-config="region=$AWS_REGION" -backend-config=encrypt=true -backend-config=use_lockfile=true
      - run: terraform -chdir=infra validate
      - name: Plan this revision
        run: terraform -chdir=infra plan -input=false -lock-timeout=5m -out="$GITHUB_WORKSPACE/.build/deploy.tfplan"
      - name: Apply the exact plan from this run
        if: inputs.action == 'apply'
        run: terraform -chdir=infra apply -input=false "$GITHUB_WORKSPACE/.build/deploy.tfplan"
      - name: Application URL
        if: inputs.action == 'apply'
        run: terraform -chdir=infra output -raw app_url >> "$GITHUB_STEP_SUMMARY"
